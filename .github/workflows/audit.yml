name: Dependency Audit

on:
  schedule:
    - cron: '20 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust / Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Verificar lockfile
        id: lock
        shell: bash
        run: |
          if [[ -f Cargo.lock ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cargo.lock ainda não existe. Gere com cargo generate-lockfile e versione." >&2
            exit 1
          fi
      - name: Advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
