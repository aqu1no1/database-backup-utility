name: Dependency Audit

on:
  schedule:
    - cron: '20 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust / Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Verificar lockfile
        id: lock
        shell: bash
        run: |
          if [[ -f Cargo.lock ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cargo.lock ainda não existe. Gere com cargo generate-lockfile e versione." >&2
            exit 1
          fi
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked
      - name: Auditar dependências
        run: cargo audit
