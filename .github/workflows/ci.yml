name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust / Quality & Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Formatação
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes unitários
        run: cargo test --workspace --lib --bins --locked
      - name: Compilação
        run: cargo build --workspace --locked

  postgres-integration:
    name: Rust / PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Docker disponível
        run: docker info
      - name: Cliente PostgreSQL 17 (modo native)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Testcontainers PostgreSQL e E2E
        env:
          DBU_REQUIRE_NATIVE: '1'
          DBU_E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: |
          pg_dump --version
          cargo test --workspace --tests --locked -- --nocapture
      - name: Logs de diagnóstico do E2E
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: Rust / Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Advisories, licenças, bans e fontes (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  angular:
    name: Angular / Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detectar aplicação Angular
        id: desktop
        run: echo "present=${{ hashFiles('apps/desktop/package.json') != '' && hashFiles('pnpm-lock.yaml') != '' }}" >> "$GITHUB_OUTPUT"
      - name: Configurar PNPM
        if: steps.desktop.outputs.present == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - name: Configurar Node.js
        if: steps.desktop.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Dependências
        if: steps.desktop.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.desktop.outputs.present == 'true'
        run: pnpm --dir apps/desktop run lint
      - name: Testes Angular
        if: steps.desktop.outputs.present == 'true'
        run: pnpm --dir apps/desktop run test:ci
      - name: Build Angular
        if: steps.desktop.outputs.present == 'true'
        run: pnpm --dir apps/desktop run build
