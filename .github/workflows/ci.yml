name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust / Quality & Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Formatação
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes unitários
        run: cargo test --workspace --lib --bins --locked
      - name: Compilação
        run: cargo build --workspace --locked

  postgres-integration:
    name: Rust / PostgreSQL & CLI Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Docker disponível
        run: docker info
      - name: Cliente PostgreSQL 17 (modo native)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Testcontainers PostgreSQL, SQLite, CLI e E2E
        env:
          DBU_REQUIRE_NATIVE: '1'
          DBU_E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: |
          pg_dump --version
          cargo test --workspace --tests --locked -- --nocapture --skip mysql:: --skip mysql_tools:: --skip mysql_connection:: --skip mongo:: --skip mongo_tools:: --skip mongo_connection::
      - name: Logs de diagnóstico do E2E
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration:
    name: Rust / MySQL Integration (${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Docker disponível
        run: docker info
      - name: Cliente MySQL 8.4 (modo native)
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
      - name: Testcontainers MySQL ${{ matrix.mysql }}
        env:
          DBU_REQUIRE_NATIVE_MYSQL: '1'
          DBU_MYSQL_TAG: ${{ matrix.mysql }}
        run: |
          mysqldump --version
          mysql --version
          cargo test -p database-backup-adapters --test integration --locked -- --nocapture mysql_tools:: mysql_connection::
          cargo test -p database-backup-cli --test integration --locked -- --nocapture mysql::

  mongo-integration:
    name: Rust / MongoDB Integration (${{ matrix.mongo }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mongo: ['7.0']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Docker disponível
        run: docker info
      - name: MongoDB Database Tools (modo native)
        run: |
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
      - name: Testcontainers MongoDB ${{ matrix.mongo }}
        env:
          DBU_REQUIRE_NATIVE_MONGO: '1'
          DBU_MONGO_TAG: ${{ matrix.mongo }}
        run: |
          mongodump --version
          mongorestore --version
          cargo test -p database-backup-adapters --test integration --locked -- --nocapture mongo_tools:: mongo_connection::
          cargo test -p database-backup-cli --test integration --locked -- --nocapture mongo::

  supply-chain:
    name: Rust / Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Advisories, licenças, bans e fontes (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  angular:
    name: Angular / Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detectar aplicação Angular
        id: desktop
        run: echo "present=${{ hashFiles('apps/desktop/package.json') != '' && hashFiles('pnpm-lock.yaml') != '' }}" >> "$GITHUB_OUTPUT"
      - name: Configurar PNPM
        if: steps.desktop.outputs.present == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - name: Configurar Node.js
        if: steps.desktop.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Dependências
        if: steps.desktop.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.desktop.outputs.present == 'true'
        run: pnpm --dir apps/desktop run lint
      - name: Testes Angular
        if: steps.desktop.outputs.present == 'true'
        run: pnpm --dir apps/desktop run test:ci
      - name: Build Angular
        if: steps.desktop.outputs.present == 'true'
        run: pnpm --dir apps/desktop run build
