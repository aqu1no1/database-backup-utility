[workspace]
resolver = "3"
members = ["apps/cli", "crates/core", "crates/database-adapters"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
database-backup-core = { path = "crates/core" }
clap = { version = "4.5", features = ["derive"] }
testcontainers = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = "0.7"
